# Static arm64 + Metal archive for the Context-Assist voice-worker.
# Job `test` runs the `context-assist` tests first; `build` runs only after it passes.
# Tag `ca-*` publishes a GitHub Release; on a red `test` the tag is deleted and no
# Release is created. Dispatch only uploads an artifact.
name: context-assist-static

on:
  push:
    tags: ["ca-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    env:
      # Pinned toolchain: the archive is bit-reproducible only with the same Xcode.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      # Configuring the tests needs crispasr-cli, which needs c2pa-audio.
      - name: Submodules
        run: git submodule update --init --depth 1 ggml third_party/c2pa-audio
      - name: Tools
        run: |
          brew install ninja
          cmake --version
      # Same ggml patch as build-static.sh (F4); the checkout is thrown away, no revert.
      - name: ggml patch
        run: git -C ggml apply ../context-assist/patches/ggml-metal-cache-flush.patch
      - name: Build tests
        run: |
          cmake -S . -B build-test -G Ninja -DCRISPASR_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-test --target context-assist-tests
      - name: Test
        run: ctest --test-dir build-test -L unit -L context-assist --output-on-failure --no-tests=error

  delete-tag:
    needs: test
    if: failure() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$GITHUB_REF_NAME"

  build:
    needs: test
    runs-on: macos-15
    env:
      # Pinned toolchain: the archive is bit-reproducible only with the same Xcode.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: ggml submodule (c2pa-audio is not needed)
        run: git submodule update --init --depth 1 ggml
      - name: Tools
        run: |
          brew install ninja
          xcodebuild -version
          cmake --version
      - name: Build
        run: |
          TAG="${GITHUB_REF_NAME#ca-}"
          [ "$GITHUB_REF_TYPE" = tag ] || TAG="$(git rev-parse --short=12 HEAD)"
          CRISPASR_DIST_TAG="$TAG" context-assist/build-static.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: crispasr-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*/BUILD-INFO
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file dist/*/BUILD-INFO
